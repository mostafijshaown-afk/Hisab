const TYPES=Object.keys(EM),NAV=[["dash","📊"],["month","📅"],["add","➕"],["sell","🟢"],["buy","🔴"],["stock","📦"],["party","👥"],["other","💸"],["log","📝"],["set","⚙️"]];
let L="bn",tab="dash",flt="all",books={},me=null,db=null,assets=null,canWrite=true,editId=null,editUid=null,loaded=false,toast="",sel="",mon="",mflt="all",pend=null,pSel="",rf="",rt="";
try{L=localStorage.getItem("hl")||"bn";const bg=localStorage.getItem("hbg");if(bg)document.documentElement.style.setProperty("--bg",bg)}catch(e){}
const t=k=>T[L][k]||k,lbl=k=>EM[k]+" "+t(k);
const fmt=n=>"৳"+Math.round(n).toLocaleString(L==="bn"?"bn-BD":"en-US");
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const isS=ty=>ty.startsWith("sale"),isSP=ty=>isS(ty)||ty==="purchase";
const pd=e=>(e.paid===undefined||e.paid===null||e.paid==="")?(+e.amt||0):+e.paid;
function calc(list){const r={sales:0,pur:0,exp:0,cash:0,bank:0};
 for(const e of list){const a=+e.amt||0,p=pd(e);
  if(isS(e.type)){r.sales+=a;r[e.acct]+=p}else if(e.type==="purchase"){r.pur+=a;r[e.acct]-=p}
  else if(e.type==="expense"){r.exp+=a;r[e.acct]-=a}else if(e.type==="recv")r[e.acct]+=a;else if(e.type==="pay")r[e.acct]-=a;
  else if(e.type==="deposit"){r.cash-=a;r.bank+=a}else if(e.type==="withdraw"){r.bank-=a;r.cash+=a}}
 return r}
const allE=()=>Object.entries(books).flatMap(([uid,b])=>(b.entries||[]).map(e=>({...e,uid,pname:b.name})));
const allP=()=>Object.entries(books).flatMap(([uid,b])=>(b.parties||[]).map(p=>({...p,uid})));
function delta(e){const a=+e.amt||0;if(isS(e.type))return a-pd(e);if(e.type==="purchase")return -(a-pd(e));if(e.type==="recv")return -a;if(e.type==="pay")return a;return 0}
function balOf(list){let b=0;for(const e of list)b+=delta(e);return b}
const pname=id=>{const p=allP().find(x=>x.id===id);return p?p.name:""};
const sm=e=>e?`${lbl(e.type)} ${fmt(e.amt)}${e.item?" · "+esc(e.item)+"×"+(e.qty||0):""}${e.party?" · "+esc(pname(e.party)):""}`:"";
function card(c,label){const pr=c.sales-c.pur-c.exp;return `<div class="card"><div class="k">${label}</div><div class="v ${c.cash+c.bank>=0?'pos':'neg'}">${fmt(c.cash+c.bank)}</div><div class="grid" style="margin-top:8px"><div><div class="k">💵 ${t("cashBal")}</div><b>${fmt(c.cash)}</b></div><div><div class="k">🏦 ${t("bankBal")}</div><b>${fmt(c.bank)}</b></div><div><div class="k">🟢 ${t("sales")}</div><b>${fmt(c.sales)}</b></div><div><div class="k">🔴 ${t("pur")}</div><b>${fmt(c.pur)}</b></div><div><div class="k">💸 ${t("exp")}</div><b>${fmt(c.exp)}</b></div><div><div class="k">${t("profit")}</div><b class="${pr>=0?'pos':'neg'}">${fmt(pr)}</b></div></div></div>`}
const names=()=>Object.entries(books).filter(([,b])=>b.name);
function dues(){let g=0,o=0;const E=allE();allP().forEach(p=>{const b=balOf(E.filter(e=>e.party===p.id));if(b>0)g+=b;else o-=b});return [g,o]}
function dash(){const cur=(sel&&books[sel])?sel:me,[g,o]=dues();
 return card(calc(allE()),"👥 "+t("both"))+`<div class="card note">🤝 ${t("totGet")}: <b class="pos">${fmt(g)}</b> · ${t("totGive")}: <b class="neg">${fmt(o)}</b></div><div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px">${names().map(([u,b])=>`<button data-p="${u}" style="flex:1;font-weight:700;${u===cur?'background:var(--ac);color:#fff;border-color:var(--ac)':''}">${esc(b.name)}</button>`).join("")}</div>`+(books[cur]?card(calc(books[cur].entries||[]),"👤 "+esc(books[cur].name||"")):"")}
function qtyTable(E){const m={};E.forEach(e=>{if(!e.item)return;const k=e.item.trim().toLowerCase();m[k]=m[k]||{n:e.item.trim(),b:0,s:0};const q=+e.qty||0;if(e.type==="purchase")m[k].b+=q;else if(isS(e.type))m[k].s+=q});return Object.values(m).sort((a,b)=>a.n.localeCompare(b.n))}
const thr=()=>{try{const v=localStorage.getItem("hlow");return v===null||v===""?5:(parseInt(v)||0)}catch(e){return 5}};
const lowItems=()=>qtyTable(allE()).filter(x=>x.b-x.s<=thr());
function monthV(){if(!mon)mon=today().slice(0,7);
 let E=allE().filter(e=>(e.date||"").slice(0,7)===mon);if(mflt!=="all")E=E.filter(e=>e.uid===mflt);
 const c=calc(E),pr=c.sales-c.pur-c.exp,r=qtyTable(E);
 return `<div class="card"><label>${t("month")}</label><input id="mon" type="month" value="${mon}"><label>${t("who")}</label><select id="mf"><option value="all">${t("both")}</option>${names().map(([u,b])=>`<option value="${u}" ${mflt===u?'selected':''}>${esc(b.name)}</option>`).join("")}</select></div>
 <div class="card grid"><div><div class="k">🟢 ${t("sales")}</div><div class="v">${fmt(c.sales)}</div></div><div><div class="k">🔴 ${t("pur")}</div><div class="v">${fmt(c.pur)}</div></div><div><div class="k">💸 ${t("exp")}</div><div class="v">${fmt(c.exp)}</div></div><div><div class="k">${t("profit")}</div><div class="v ${pr>=0?'pos':'neg'}">${fmt(pr)}</div></div></div>

 ${r.length?`<div class="card wrap"><table><tr><th>${t("item")}</th><th>🔴 ${t("bought")}</th><th>🟢 ${t("sold")}</th></tr>${r.map(x=>`<tr><td>${esc(x.n)}</td><td>${x.b}</td><td>${x.s}</td></tr>`).join("")}</table></div>`:`<p class="note">${t("none")}</p>`}`}
function stockV(){const r=qtyTable(allE()),th=thr();
 const box=`<div class="card"><label>⚠️ ${t("thr")}</label><input id="thr" type="number" inputmode="numeric" min="0" value="${th}"></div>`;

const itemNames=()=>[...new Set(allE().filter(e=>e.item).map(e=>e.item.trim()))];
function ledV(){const p=allP().find(x=>x.id===pSel);if(!p){pSel="";return partyV()}

async function saveCsv(E,name){

function compress(f){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);c.toBlob(b=>b?ok(b):no(),"image/jpeg",.6)};im.onerror=no;im.src=r.result};r.onerror=no;r.readAsDataURL(f)})}
async function mutate(uid,fn){const b=books[uid]||{name:"",entries:[],parties:[],log:[]};
 const next={name:b.name,entries:[...(b.entries||[])],parties:[...(b.parties||[])],log:[...(b.log||[])]};
 const lg=(a,o,n)=>{next.log.push({t:Date.now(),by:(books[me]||{}).name||"?",a,o:o||null,n:n||null})};
 fn(next,lg);
 try{const bt=db.batch(),sync=(col,oldL,newL)=>{const ids=new Set(newL.map(x=>x.id));oldL.forEach(x=>{if(!ids.has(x.id))bt.delete(db.collection(col).doc(x.id))});
   newL.forEach(x=>{const o=oldL.find(y=>y.id===x.id);if(!o||JSON.stringify(o)!==JSON.stringify(x))bt.set(db.collection(col).doc(x.id),{...x,uid})})};
  sync("entries",b.entries||[],next.entries);sync("parties",b.parties||[],next.parties);
  next.log.slice((b.log||[]).length).forEach(l=>bt.set(db.collection("logs").doc(),{...l,uid}));
  if(next.name!==b.name)bt.set(db.collection("users").doc(uid),{name:next.name},{merge:true});
  await bt.commit();notify(next,b)}catch(e){console.log(e);toast=t("err");render();return false}return true}
